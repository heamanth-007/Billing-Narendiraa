# ==============================================================================
# Nginx Configuration for Billing Narendiraa
# Domain: billing.narendiraaenterprises.com
# Backend Port: 5014
#
# Installation on VPS:
# sudo cp nginx/billing-narendiraa.conf /etc/nginx/sites-available/billing-narendiraa
# sudo ln -sf /etc/nginx/sites-available/billing-narendiraa /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl restart nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name billing.narendiraaenterprises.com;

    # Root directory for frontend build
    root /var/www/billing-narendiraa/dist;
    index index.html;

    # Maximum file upload size (for PDF bills, documents, backups)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Frontend SPA Route handling
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Backend API Proxy (Forward requests to Express server running on port 5014)
    location /api/ {
        proxy_pass http://127.0.0.1:5014/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for longer requests / uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Custom 404 page redirect to index.html for client-side routing
    error_page 404 /index.html;
}
